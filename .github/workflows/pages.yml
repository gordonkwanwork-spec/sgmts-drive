name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Saved versions: "path=tag". Each is built from its tag into /versions/<path>/; existing links never change.
  SAVED_VERSIONS: "2026-09-23=game-2026-09-23-optimized 2026-09-24=game-2026-09-24"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add saved versions
        run: |
          mkdir -p site && cp -R dist/. site/
          for pair in $SAVED_VERSIONS; do
            path="${pair%%=*}"; ref="${pair#*=}"
            git fetch --no-tags origin "refs/tags/${ref}:refs/tags/${ref}"
            git worktree add --detach "$RUNNER_TEMP/$path" "$ref"
            (cd "$RUNNER_TEMP/$path" && npm ci && npm run build)
            mkdir -p "site/versions/$path"
            cp -R "$RUNNER_TEMP/$path/dist/." "site/versions/$path/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
