name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREVIEW_REF: game-2026-09-23

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add saved recent version
        run: |
          mkdir -p site/versions/2026-09-23
          cp -R dist/. site/
          git fetch --no-tags origin "refs/tags/${PREVIEW_REF}:refs/tags/${PREVIEW_REF}"
          git worktree add --detach "$RUNNER_TEMP/preview" "$PREVIEW_REF"
          cd "$RUNNER_TEMP/preview"
          npm ci
          npm run build
          cp -R dist/. "$GITHUB_WORKSPACE/site/versions/2026-09-23/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
