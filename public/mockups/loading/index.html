<script>
// Standalone design study: progress is simulated, not connected to the game loader.
const stations=[
 {"id":"A1","name":"Nai Wai","zh":"泥圍","simplified":"泥围","terminus":true},
 {"id":"A2","name":"Hung Shui Kiu","zh":"洪水橋","simplified":"洪水桥","terminus":false},
 {"id":"A3","name":"Hung Shui Kiu North","zh":"洪水橋北","simplified":"洪水桥北","terminus":false},
 {"id":"A4","name":"Ha Tsuen South","zh":"厦村南","simplified":"厦村南","terminus":false},
 {"id":"A5","name":"Ha Tsuen","zh":"厦村","simplified":"厦村","terminus":false},
 {"id":"A6","name":"Logistics Cluster","zh":"物流圈","simplified":"物流圈","terminus":false},
 {"id":"A7","name":"Industry Park","zh":"產業園","simplified":"产业园","terminus":true}
]
;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function setTheme(theme){document.body.dataset.uiTheme=theme;$$('.brand-logo').forEach(el=>el.src='../../branding/sgmts-drive-'+theme+'.png');$('#theme').textContent=theme==='light'?'☾ Dark theme':'☀ Light theme';$('#theme').setAttribute('aria-pressed',String(theme==='dark'));}
let initialTheme='light';try{if(localStorage.getItem('sgmts-ui-theme')==='dark')initialTheme='dark';}catch{}
setTheme(initialTheme);$('#theme').onclick=()=>setTheme(document.body.dataset.uiTheme==='light'?'dark':'light');
const path=$('#lit'), length=path.getTotalLength();
const points=stations.map((s,i)=>path.getPointAtLength(length*i/6));
$('#map-stops').innerHTML=stations.map((s,i)=>{const p=points[i];return `<g transform="translate(${p.x},${p.y})"><circle r="8" fill="var(--ui-paper)" stroke="var(--ui-cyan)" stroke-width="3"/><text class="code" y="-32" text-anchor="middle">${s.id}</text><text class="name" y="72" text-anchor="middle">${s.name}</text><text y="94" text-anchor="middle">${s.zh}</text></g>`}).join('');
$('.mini-route').innerHTML=stations.map(s=>`<div class="mini-stop"><span>${s.id}</span></div>`).join('');
$('.list').innerHTML=stations.map(s=>`<div class="row"><b>${s.id}</b><span>${s.name}</span><i>·</i></div>`).join('');
$('.flaps').innerHTML=Array.from('01/07',c=>`<div class="flap">${c}</div>`).join('');
let view=0,time=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(t){
 const progress=Math.min(t/16,1), raw=progress*6, index=Math.min(Math.floor(raw),6), phase=raw-index;
 $$('.screen h1').forEach((el,i)=>el.textContent=progress===1?'Your route is ready.':['Preparing your route.','Your journey is loading.','Preparing departure.'][i]);
 $$('.percent').forEach(el=>el.setAttribute('aria-valuenow',Math.round(progress*100)));
 $$('.bottom .eyebrow,.ticket-status').forEach(el=>el.textContent=progress===1?'Route ready':'Loading station');
 $$('.pct').forEach(el=>el.textContent=String(Math.round(progress*100)).padStart(2,'0'));
 $$('.station-name').forEach(el=>el.textContent=stations[index].name);
 $$('.station-zh').forEach(el=>el.textContent=stations[index].zh);
 path.style.strokeDasharray=length;path.style.strokeDashoffset=length*(1-progress);
 const p=path.getPointAtLength(length*progress);$('#traveller').setAttribute('cx',p.x);$('#traveller').setAttribute('cy',p.y);
 $$('#map-stops circle').forEach((el,i)=>el.setAttribute('fill',i<=index?'var(--ui-cyan)':'var(--ui-paper)'));
 $$('.mini-stop').forEach((el,i)=>el.classList.toggle('done',i<=index));
 // Hold each platform sign, then ease it out as the train departs.
 const travel=phase<.35?0:Math.pow((phase-.35)/.65,2);
 $('.sign').style.transform=`translateX(${-travel*800}px)`;$('.sign').style.opacity=1-travel;
 $('.post').style.transform=`translateX(${-phase*1100}px)`;
 $('.city').style.transform=`translateX(${-progress*100}px)`;
 $('.hills').style.transform=`translateX(${-progress*40}px)`;
 $$('.row').forEach((el,i)=>{el.classList.toggle('current',i===index);el.querySelector('i').textContent=i<index||progress===1?'✓':i===index?'←':'·'});
 const flap=$$('.flap')[1];flap.textContent=index+1;flap.style.transform=`perspective(300px) rotateX(${progress<1&&phase<.09?-60*(1-phase/.09):0}deg)`;
}
function select(i){view=i;$$('.screen').forEach((el,n)=>{el.classList.toggle('active',n===i);el.hidden=n!==i});$$('[data-view]').forEach((el,n)=>el.setAttribute('aria-pressed',n===i));time=0;render(time)}
function syncPause(){$('#pause').textContent=playing?'Pause':'Play';$('#pause').setAttribute('aria-label',playing?'Pause animation':'Play animation')}
$$('[data-view]').forEach(el=>el.onclick=()=>select(Number(el.dataset.view)));
$('#pause').onclick=()=>{playing=!playing;syncPause()};$('#restart').onclick=()=>{time=0;render(0)};
window.__seek=t=>{time=Math.max(0,Math.min(18,t));render(time)};
function tick(now){if(last===null){last=now;window.__ready=true}if(playing&&!document.hidden){time+=Math.min((now-last)/1000,.1);if(time>18)time=window.__recording?18:0;render(time)}last=now;requestAnimationFrame(tick)}
render(0);syncPause();requestAnimationFrame(tick);
</script></body></html>
